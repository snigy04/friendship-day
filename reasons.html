<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reasons I Love You, Haru 💌</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffd6e7, #ffecb3, #fce4ff);
      background-size: 400% 400%;
      animation: bgShift 8s ease infinite;
      font-family: 'Nunito', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden;
    }
    @keyframes bgShift {
      0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
    }

    .back-btn {
      align-self: flex-start;
      margin: 24px 0 0 24px;
      text-decoration: none;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      color: #d63384;
      font-weight: 700;
      padding: 8px 20px;
      border-radius: 50px;
      font-size: 0.9rem;
      border: 2px solid #ffb3d1;
      transition: transform 0.2s;
      z-index: 1;
    }
    .back-btn:hover { transform: scale(1.05); }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #d63384;
      font-size: clamp(1.8rem, 5vw, 3rem);
      text-align: center;
      margin: 36px 20px 8px;
      text-shadow: 2px 2px 0 #ffb3d1;
      z-index: 1;
    }
    .sub { color: #7a4f6d; font-size: 1rem; margin-bottom: 40px; text-align: center; z-index: 1; }

    .grid {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 20px; padding: 0 24px 60px; max-width: 860px; z-index: 1;
    }

    .flip-card {
      width: 180px; height: 180px;
      perspective: 800px; cursor: pointer;
    }
    .flip-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(.4,0,.2,1);
    }
    .flip-card.flipped .flip-inner { transform: rotateY(180deg); }

    .flip-front, .flip-back {
      position: absolute; inset: 0;
      border-radius: 22px;
      backface-visibility: hidden;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px;
      text-align: center;
    }
    .flip-front {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,182,213,0.6);
      box-shadow: 0 8px 28px rgba(214,51,132,0.13);
    }
    .flip-front .num {
      font-family: 'Pacifico', cursive;
      font-size: 2.4rem;
      color: #ff6b9d;
      line-height: 1;
    }
    .flip-front .tap { font-size: 0.72rem; color: #b07090; margin-top: 8px; }

    .flip-back {
      background: linear-gradient(135deg, #ff6b9d, #d63384);
      transform: rotateY(180deg);
      box-shadow: 0 8px 28px rgba(214,51,132,0.25);
    }
    .flip-back p { color: #fff; font-size: 0.88rem; line-height: 1.5; font-weight: 700; }

    footer { color: #b07090; font-size: 0.82rem; margin: 10px 0 30px; z-index: 1; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back Home</a>

  <h1>Reasons I Love You 💌</h1>
  <p class="sub">Tap each card to reveal a reason 🌸</p>

  <div class="grid" id="grid"></div>

  <footer>Made with 💖 just for Haru · Friendship Day</footer>

  <script>
    const reasons = [
      "You always know how to make me laugh even on the worst days 😂",
      "You're the most genuine person I've ever met 🌟",
      "You never judge me, no matter what 🫂",
      "You remember the little things that matter to me 💛",
      "Your energy lights up every room you walk into ✨",
      "You're always honest with me, even when it's hard 💬",
      "You've been by my side since class 7th — that's rare 🏫",
      "You make ordinary days feel like adventures 🌈",
      "You're the first person I want to tell good news to 📱",
      "You hype me up like nobody else 🎉",
      "You're strong in ways you don't even realise 💪",
      "Being your friend is genuinely one of my favourite things 💕",
    ];

    const grid = document.getElementById('grid');
    reasons.forEach((r, i) => {
      grid.innerHTML += `
        <div class="flip-card" onclick="this.classList.toggle('flipped')">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="num">${i + 1}</div>
              <div class="tap">tap to reveal 💖</div>
            </div>
            <div class="flip-back"><p>${r}</p></div>
          </div>
        </div>`;
    });
  </script>
</body>
</html>

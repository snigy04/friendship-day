<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wish Jar 🫙</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #d4f1f9, #e8fce8, #ffd6e7);
      background-size: 400% 400%;
      animation: bgShift 8s ease infinite;
      font-family: 'Nunito', sans-serif;
      display: flex; flex-direction: column; align-items: center;
      overflow-x: hidden;
    }
    @keyframes bgShift {
      0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
    }

    .back-btn {
      align-self: flex-start; margin: 24px 0 0 24px;
      text-decoration: none; background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px); color: #059669; font-weight: 700;
      padding: 8px 20px; border-radius: 50px; font-size: 0.9rem;
      border: 2px solid #6ee7b7; transition: transform 0.2s; z-index: 1;
    }
    .back-btn:hover { transform: scale(1.05); }

    h1 {
      font-family: 'Pacifico', cursive; color: #059669;
      font-size: clamp(1.8rem, 5vw, 3rem); text-align: center;
      margin: 36px 20px 8px; text-shadow: 2px 2px 0 #a7f3d0; z-index: 1;
    }
    .sub { color: #3d7a5e; font-size: 1rem; margin-bottom: 40px; text-align: center; z-index: 1; }

    .jar-wrap { position: relative; z-index: 1; cursor: pointer; user-select: none; margin-bottom: 32px; }
    .jar-emoji {
      font-size: 9rem;
      display: block; text-align: center;
      transition: transform 0.15s;
      filter: drop-shadow(0 8px 20px rgba(5,150,105,0.25));
    }
    .jar-wrap:hover .jar-emoji { transform: scale(1.08); }
    .jar-wrap.shake .jar-emoji { animation: shake 0.45s ease; }
    @keyframes shake {
      0%,100%{transform:rotate(0deg);}
      20%{transform:rotate(-12deg) scale(1.1);}
      40%{transform:rotate(12deg) scale(1.1);}
      60%{transform:rotate(-8deg);}
      80%{transform:rotate(8deg);}
    }
    .jar-hint { text-align: center; font-size: 0.85rem; color: #6b9e8a; margin-top: 6px; }

    .wish-card {
      background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
      border-radius: 24px; max-width: 420px; width: calc(100% - 48px);
      padding: 32px 28px; text-align: center;
      box-shadow: 0 10px 40px rgba(5,150,105,0.15);
      border: 2px solid #a7f3d0; z-index: 1; margin-bottom: 16px;
      min-height: 120px; display: flex; align-items: center; justify-content: center;
    }
    .wish-text {
      font-family: 'Pacifico', cursive; color: #059669;
      font-size: 1.15rem; line-height: 1.6;
      animation: fadeIn 0.4s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
    .wish-placeholder { color: #9dc9b8; font-size: 0.95rem; }

    .counter { color: #6b9e8a; font-size: 0.82rem; margin-bottom: 32px; z-index: 1; }

    .all-wishes {
      background: rgba(255,255,255,0.7); backdrop-filter: blur(8px);
      border-radius: 20px; max-width: 480px; width: calc(100% - 48px);
      padding: 24px; z-index: 1; margin-bottom: 50px;
      border: 2px solid #a7f3d0;
    }
    .all-wishes h3 { font-family: 'Pacifico', cursive; color: #059669; font-size: 1rem; margin-bottom: 14px; }
    .wish-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .wish-list li { font-size: 0.88rem; color: #3d7a5e; padding: 8px 12px; background: rgba(167,243,208,0.3); border-radius: 10px; }

    footer { color: #6b9e8a; font-size: 0.82rem; margin-bottom: 30px; z-index: 1; }
  </style>
</head>
<body>

  <a href="index.html" class="back-btn">← Back Home</a>
  <h1>Wish Jar 🫙</h1>
  <p class="sub">Shake the jar for a little wish just for you 🌿</p>

  <div class="jar-wrap" id="jar" onclick="shakeJar()">
    <span class="jar-emoji">🫙</span>
    <div class="jar-hint">tap to shake!</div>
  </div>

  <div class="wish-card" id="wish-card">
    <span class="wish-placeholder">Your wish is waiting inside… 🌟</span>
  </div>
  <div class="counter" id="counter"></div>

  <div class="all-wishes">
    <h3>✨ All the wishes in your jar</h3>
    <ul class="wish-list" id="wish-list"></ul>
  </div>

  <footer>Made with 💖 just for Haru · Friendship Day</footer>

  <script>
    const wishes = [
      "May every day bring you something that makes you smile 🌸",
      "I wish you all the confidence to chase every dream you have 🌟",
      "May you always know how loved and valued you are 💕",
      "I wish you belly laughs, good food, and great company always 🍜😂",
      "May this year be your most beautiful one yet 🌈",
      "I wish you peace on your hard days and joy on your good ones 🕊️",
      "May you never doubt how amazing you truly are ✨",
      "I wish us a thousand more memories together 📸",
      "May every door you knock on open wide for you 🚪🌟",
      "I wish you all the happiness you so freely give to others 💛",
    ];

    let shown = [];
    const jar = document.getElementById('jar');
    const card = document.getElementById('wish-card');
    const counter = document.getElementById('counter');
    const list = document.getElementById('wish-list');

    wishes.forEach(w => {
      list.innerHTML += `<li>🌿 ${w}</li>`;
    });

    function shakeJar() {
      if (shown.length === wishes.length) shown = [];
      jar.classList.remove('shake');
      void jar.offsetWidth;
      jar.classList.add('shake');

      const remaining = wishes.filter((_, i) => !shown.includes(i));
      const idx = wishes.indexOf(remaining[Math.floor(Math.random() * remaining.length)]);
      shown.push(idx);

      card.innerHTML = `<span class="wish-text">${wishes[idx]}</span>`;
      counter.textContent = `${shown.length} of ${wishes.length} wishes revealed`;
    }
  </script>
</body>
</html>
